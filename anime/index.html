<div class="shell">
  <header class="topbar">
    <a class="brand" href="../" aria-label="返回かな日和首頁">

  <main>
    <header class="hero">
      <span class="eyebrow">ANIME LINES · 進撃の巨人</span>
      <h1>把台詞唸出口，<em>獻出你的心臟。</em></h1>
      <p>從《進擊的巨人》的經典名言開始，練習日文整句的節奏、語感與發音。每個詞都配上假名與羅馬拼音。</p>
      <div class="hero-foot"><span id="totalLines">9 句日文台詞</span><span>點詞語聽發音 · 點整句跟讀</span></div>

    <section class="toolbar" aria-label="台詞搜尋與練習設定">
      <div class="search-row">
        <label class="search" for="searchInput">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>

        <button type="button" class="random-btn" id="randomBtn">↝ 抽一句</button>

      <nav class="category-nav" id="categoryNav" aria-label="台詞主題"></nav>

        </div>
        <span id="resultCount" role="status" aria-live="polite"></span>
      </div>

    <div id="featured" class="featured" hidden></div>
    <div id="sections"></div>
